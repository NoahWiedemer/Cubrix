[package]
name = "modelonio"
version = "0.1.0"
description = "Modelonio – CAD für den 3D-Druck"
authors = ["Noah Wiedemer"]
edition = "2021"

[lib]
name = "modelonio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
