name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default GITHUB_TOKEN may create releases with this permission;
# no repository setting change ("Read and write permissions") is needed.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Builds are not code-signed, but updater artifacts are signed with the updater key
      # (Cubrix.app.tar.gz + .sig on macOS, the -setup.exe + .sig on Windows). tauri-action
      # merges both jobs into latest.json; the universal macOS build is listed under
      # darwin-aarch64 and darwin-x86_64. Assets: Cubrix_X.Y.Z_universal.dmg,
      # Cubrix_universal.app.tar.gz, Cubrix_X.Y.Z_x64-setup.exe, Cubrix_X.Y.Z_x64_en-US.msi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v__VERSION__
          releaseName: Cubrix v__VERSION__
          releaseBody: |
            Cubrix v__VERSION__ – CAD für den 3D-Druck.

            - macOS (Apple Silicon und Intel): `.dmg` herunterladen, öffnen, Cubrix in „Programme“ ziehen.
              Die App ist noch nicht signiert: beim ersten Start Rechtsklick → „Öffnen“.
            - Windows: `-setup.exe` (empfohlen) oder `.msi`. SmartScreen kann warnen („Trotzdem ausführen“).
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
